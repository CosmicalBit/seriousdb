[package]
name = "seriousdb-engine"
version = "0.0.1"
edition = "2024"

[lib]
name = "_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["multiple-pymethods"] }

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
incremental = true
